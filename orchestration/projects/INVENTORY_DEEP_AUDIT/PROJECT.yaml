AcceptanceSummary:
  - Exact inventory repository snapshot is pinned before code conclusions are made
  - Current capabilities are mapped from code, schema, APIs, UI and docs rather than README claims alone
  - Fit is evaluated for e-commerce plus electronics R&D, procurement, production, warehouse, sales and after-sales
  - Relevant open-source ERP/WMS/electronics/commerce systems are benchmarked with current sources and licenses
  - Gaps are ranked by business impact, technical risk, effort, dependencies and urgency
  - At least 50 concrete UX/automation improvements are produced
  - Target architecture and 0-3-6-12-24 month roadmap are produced
  - Final report clearly separates observed facts, inferred risks and proposed changes
  - Every required verification path is reproducible without GitHub Actions

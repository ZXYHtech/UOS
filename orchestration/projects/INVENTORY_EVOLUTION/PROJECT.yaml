NonGoals:
  - No big-bang rewrite
  - No microservice split during foundation phase
  - No Kafka or generic event bus requirement
  - No mandatory Redis or Kubernetes
  - No autonomous high-risk AI mutation
  - No MRP before stock reservation and released MBOM truth are authoritative
  - No PostgreSQL migration before canonical migrations, parity tests and measured entry criteria exist
AcceptanceSummary:
  - Every implemented story has schema/domain/permission/state/idempotency/audit/test evidence where applicable
  - Existing production workflows remain backward-compatible unless an explicit migration gate approves a change
  - E00 release safety is completed before high-risk schema domains begin
  - E01 action/idempotency/job infrastructure precedes broad automation and connector rewrites
  - E02 stock/reservation kernel is proven under retry and concurrency before omnichannel ATP or MRP
  - Every production cutover first captures current deployed code and a consistent production DB backup and proves isolated restore
  - Human/operator policy decisions are recorded in OPERATOR_DECISION_REGISTER rather than guessed in code
  - No required validation or runtime path depends on GitHub Actions

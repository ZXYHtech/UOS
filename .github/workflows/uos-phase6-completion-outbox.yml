name: UOS phase6 completion outbox

on:
  push:
    branches: [main]
    paths:
      - 'tools/completion_outbox.py'
      - 'tools/phase6_completion_outbox_patch.py'
      - 'tests/test_completion_outbox_fallback.py'
      - 'tests/test_completion_outbox_batch.py'
      - '.github/workflows/uos-phase6-completion-outbox.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase-6 patch
        run: python tools/phase6_completion_outbox_patch.py
      - name: Compile kernel
        run: |
          python -m py_compile \
            tools/uos.py \
            tools/canonical_runner.py \
            tools/completion_outbox.py \
            tools/claim_broker_v2.py \
            tools/claim_telemetry.py
      - name: Run fallback, fencing, and lifecycle regressions
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m unittest tests.test_completion_outbox_fallback -v
            python -m unittest tests.test_git_cas_lifecycle -v
            python -m unittest tests.test_claim_request_reclaim -v
            python -m unittest tests.test_work_session_v2_recovery -v
          } 2>&1 | tee phase6-core.log
      - name: Upload core log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-core-log
          path: phase6-core.log
      - name: Fail if core tests failed
        if: steps.tests.outcome != 'success'
        run: |
          cat phase6-core.log
          exit 1

  batch-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scale: [2, 5, 10, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase-6 patch
        run: python tools/phase6_completion_outbox_patch.py
      - name: Run completion batch acceptance
        env:
          UOS_OUTBOX_SCALE: ${{ matrix.scale }}
        run: python -m unittest tests.test_completion_outbox_batch -v

  publish-tested-kernel:
    needs: [core-regressions, batch-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tested Phase-6 patch
        run: python tools/phase6_completion_outbox_patch.py
      - name: Compile final candidate
        run: python -m py_compile tools/uos.py tools/canonical_runner.py tools/completion_outbox.py
      - name: Diff check
        run: git diff --check
      - name: Commit tested Outbox integration
        run: |
          if git diff --quiet; then
            echo 'No Phase-6 kernel patch needed.'
            exit 0
          fi
          git config user.name 'UOS Kernel Bot'
          git config user.email 'uos-kernel@example.invalid'
          git add tools/uos.py tools/canonical_runner.py tests
          git commit -m 'feat: add completion outbox fallback and batch integration'
          for n in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n * 2))
          done
          echo 'Failed to publish tested Phase-6 integration after retries' >&2
          exit 1

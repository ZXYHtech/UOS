name: UOS claim integrity

on:
  push:
    branches: [main]
    paths:
      - 'coordination/claims/**'
      - 'coordination/claim_grants/**'
      - 'coordination/completed/**'
      - 'tools/claim_integrity_scan.py'
      - 'tools/canonical_runner.py'
      - '.github/workflows/uos-claim-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scanner
        run: python -m py_compile tools/claim_integrity_scan.py
      - name: Scan canonical ownership integrity
        run: python tools/claim_integrity_scan.py --fail-on-violation
      - name: Summarize integrity states
        if: always()
        shell: python
        run: |
          import csv
          from collections import Counter
          from pathlib import Path
          p = Path('coordination/runtime/CLAIM_INTEGRITY.csv')
          if not p.exists():
              print('CLAIM_INTEGRITY.csv was not produced')
              raise SystemExit(1)
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          print('rows=', len(rows))
          print('states=', dict(Counter(r['integrity_status'] for r in rows)))
          for r in rows:
              if r['integrity_status'] in {'VIOLATION','REPAIRED'}:
                  print(r)
      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-integrity-report
          path: coordination/runtime/CLAIM_INTEGRITY.csv
          if-no-files-found: error

name: UOS Agent Field Book

on:
  push:
    branches:
      - uos-agent-field-book-20260903

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Canonical complete facilities task
        shell: bash
        run: |
          set -euo pipefail
          LOCK=coordination/claims/TASK_TRAVEL_FIELD_FACILITIES_01.lock
          test -f "$LOCK"
          LEASE_TOKEN=$(awk -F': ' '$1=="LeaseToken"{print $2}' "$LOCK")
          test -n "$LEASE_TOKEN"
          python tools/uos.py \
            --ack-execution-epoch UOS_EXEC_20260902_01 \
            complete \
            --agent-id AG_TRAVEL_FIELD_BOOK \
            --task TASK_TRAVEL_FIELD_FACILITIES_01 \
            --lease-token "$LEASE_TOKEN" \
            --result PASS | tee complete-output.json
          echo '--- COMPLETE OUTPUT ---'
          cat complete-output.json

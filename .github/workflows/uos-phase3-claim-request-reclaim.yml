name: UOS phase3 claim request reclaim

on:
  push:
    branches: [main]
    paths:
      - 'tools/phase3_claim_request_reclaim_patch.py'
      - 'tools/claim_integrity_scan.py'
      - 'tests/test_claim_request_reclaim.py'
      - '.github/workflows/uos-phase3-claim-request-reclaim.yml'

permissions:
  contents: write

jobs:
  backport-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase-3 Request/Reclaim patch
        run: python tools/phase3_claim_request_reclaim_patch.py
      - name: Compile kernel
        run: python -m py_compile tools/uos.py tools/canonical_runner.py tools/claim_integrity_scan.py tools/high_contention_claim.py
      - name: Run Phase-3 and regression tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m unittest tests.test_claim_request_reclaim -v
            python -m unittest tests.test_claim_grant_integrity -v
            python -m unittest tests.test_git_cas_lifecycle -v
            python -m unittest tests.test_project_warmup_override -v
          } 2>&1 | tee phase3-test.log
      - name: Upload Phase-3 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-test-log
          path: phase3-test.log
      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: |
          cat phase3-test.log
          exit 1
      - name: Diff check
        run: git diff --check
      - name: Commit tested Phase-3 backport
        run: |
          if git diff --quiet -- tools/canonical_runner.py; then
            echo 'No canonical_runner patch needed.'
            exit 0
          fi
          git config user.name 'UOS Kernel Bot'
          git config user.email 'uos-kernel@example.invalid'
          git add tools/canonical_runner.py
          git commit -m 'feat: persist Claim Request and reclaim provenance'
          for n in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n * 2))
          done
          echo 'Failed to publish tested Phase-3 backport' >&2
          exit 1

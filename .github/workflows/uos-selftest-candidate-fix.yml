name: UOS selftest candidate fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/selftest_candidate_fix_20260903.py'
      - '.github/workflows/uos-selftest-candidate-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact candidate fixes
        run: python tools/selftest_candidate_fix_20260903.py
      - name: Compile candidate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m py_compile tools/work_session.py tests/test_quality_visibility.py tests/test_partial_handoff_git_cas.py
      - name: Run full standalone selftest
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/selftest.py
      - name: Diff check
        run: git diff --check
      - name: Publish exact tested files
        run: |
          git config user.name 'UOS Kernel Bot'
          git config user.email 'uos-kernel@example.invalid'
          git add \
            tools/work_session.py \
            tests/test_quality_visibility.py \
            tests/test_partial_handoff_git_cas.py
          git commit -m 'fix: restore full standalone selftest invariants'
          git reset --hard HEAD
          git clean -fd
          for n in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n * 2))
          done
          echo 'Failed to publish exact tested selftest fixes' >&2
          exit 1

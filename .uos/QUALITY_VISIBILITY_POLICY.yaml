Schema: UOS_QUALITY_VISIBILITY_V1
RuleVersion: VISIBILITY_V1
RuleEpoch: 1
Enabled: true

Review:
  WarmupRequired: 3
  WarmupMaxConcurrentClaims: 1
  SampleEvery: 5
  HighRiskAlwaysReview: true
  BlockNewClaimsWhilePending: true

Presentation:
  AgentMustPresentResultInConversation: true
  UserMustNotBeSentToRepositoryForRoutineInspection: true
  CompletionSummaryRequired: true

Preview:
  AutoExpandTaskOutputs: true
  RequireDeclaredOrInferredPreview: true
  SvgToPng: true
  HtmlToPng: true
  PdfToPng: true
  OfficeToPdf: true
  CadEdaToPng: true

Notes:
  RuleEpoch must increment whenever review or preview rules materially change.
  During the first three reviewed completions of a RuleEpoch only one task Claim may be active at a time.
  Each of those three results must be presented to and confirmed by the operator before the next new Claim.
